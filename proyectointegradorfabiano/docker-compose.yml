services:
  mysql:
    image: mysql:8.4
    container_name: coldtrace-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: coldtrace
      MYSQL_USER: coldtrace
      MYSQL_PASSWORD: coldtrace123
    ports:
      - "3306:3306"
    volumes:
      - coldtrace-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: coldtrace-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: coldtrace
      PMA_PASSWORD: coldtrace123
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  coldtrace-mysql-data:
