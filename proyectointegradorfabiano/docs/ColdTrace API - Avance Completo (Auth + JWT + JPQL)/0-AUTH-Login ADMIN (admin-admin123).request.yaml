$kind: http-request
name: 0-AUTH-Login ADMIN (admin/admin123)
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "admin",
      "password": "admin123"
    }
scripts:
  - type: afterResponse
    code: |-
      var j = pm.response.json();
      pm.collectionVariables.set('jwt', j.token);
    language: text/javascript
order: 2000
