spring:
  application:
    name: WebIntegrado

  # Perfil activo por defecto: MySQL (requiere `docker compose up -d`).
  # Para trabajar sin base de datos externa:
  #   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=h2
  profiles:
    default: mysql

  jpa:
    open-in-view: false
    show-sql: false

server:
  port: 8080

app:
  jwt:
    secret: ColdTrace-Super-Secret-Key-32-Chars-Min!!
    expiration-ms: 86400000
