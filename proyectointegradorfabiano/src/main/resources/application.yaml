spring:
  application:
    name: WebIntegrado
  datasource:
    url: jdbc:h2:mem:coldtrace
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true

server:
  port: 8080

app:
  jwt:
    secret: ColdTrace-Super-Secret-Key-32-Chars-Min!!
    expiration-ms: 86400000
